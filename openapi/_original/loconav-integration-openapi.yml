openapi: 3.0.3
info:
  title: LocoNav Integration API
  version: v1
  description: 'LocoNav''s REST APIs for fleet telematics integration: telematics (sensor/GPS/video/live-stream),
    CRUD resource management (drivers, vehicles, trips, geofences, users), safety and connected-driver
    features, alerts and alert-subscriptions, and immobilization. Converted from LocoNav''s published
    Postman documentation at developers.loconav.com. All listing endpoints are paginated (page/perPage);
    time parameters use epoch seconds.'
  contact:
    name: LocoNav Developer Support
    url: https://developers.loconav.com/
servers:
- url: https://api.a.loconav.com/integration/api/v1
  description: Production
tags:
- name: Drivers
  description: '<p>Efficient driver management is essential for the optimal operation of a fleet.</p>

    <p>Leveraging the capabilities of LocoNav REST APIs, fleet managers can seamlessly create, update,
    and retrieve detailed information about drivers. The system allows for precise retrieval of driver
    details based on their names, enabling informed decision-making.</p>

    <p>Moreover, fleet managers can maintain the accuracy of their driver roster by securely deleting
    off-record drivers. This suite of features empowers fleet managers to maintain a well-organized and
    high-performing team, enhancing overall fleet management effectiveness.</p>

    '
- name: Video Telematics VT
  description: '<p>Video telematics APIs enable integration with video data captured by telematics systems
    in vehicles. These APIs provide access to various functionalities related to managing and analyzing
    video data, including live streaming, video recording, playback, and analytics.</p>

    <p>Developers can use these APIs to build applications that leverage video footage for fleet management,
    driver monitoring, safety analysis, and more. By integrating video telematics APIs into their systems,
    businesses can enhance the efficiency, safety, and security of their<br />operations on the road.</p>

    '
- name: Video Telematics VT / Live Stream
- name: Video Telematics VT / Videos
- name: Alert Subscriptions
  description: '<p>With our Alert subscription APIs, you can manage the alerts effectively on a platform</p>

    '
- name: Mobilization
- name: Vehicles
  description: '<p>Loconav''s Vehicle APIs offer developers a powerful toolkit for real-time fleet management.
    The Fetch Vehicle Details API provides comprehensive vehicle insights, while the Last Known Stats
    API delivers live statistics.</p>

    <p>These APIs enable developers to create efficient, data-driven solutions for fleet monitoring and
    analytics, enhancing operational efficiency and decision-making.</p>

    '
- name: Vehicles / Telematics
  description: '<p>Thes APIs allows you to access telematics data for vehicles, enabling you to retrieve
    real-time information and history about their status, location, and various sensor readings.</p>

    '
- name: Alerts
- name: Polygon (Geofence)
  description: '<p>A geofence is a virtual boundary, often a <strong>rectangular bounding box</strong>,
    created using mapping software with specified latitude and longitude coordinates. Integrated with
    fleet management and telematics, geofences trigger real-time alerts if a GPS-equipped vehicle or equipment
    moves beyond authorized limits, enhancing security and asset monitoring.</p>

    <hr />

    <p><strong>Use Cases</strong></p>

    <ol>

    <li><strong>Security and Alerts:</strong> Geofences can be established around construction sites where
    valuable equipment is stationed. If any equipment equipped with a GPS tracker is detected leaving
    the predefined area, immediate alerts are triggered, helping prevent theft and aiding in the recovery
    of the asset.</li>

    <li><strong>Delivery Route Compliance:</strong> For logistics and delivery services, geofences can
    be set along specified routes or delivery zones. If a delivery vehicle deviates from the planned route
    or enters unauthorized areas, real-time alerts ensure adherence to planned schedules and prevent potential
    route deviations or unauthorized stops.</li>

    </ol>

    '
- name: Trips
- name: Users
- name: FAQs
  description: '<h4 id="q-how-do-i-authenticate-my-requests-to-the-apis">Q: How do I authenticate my requests
    to the APIs?</h4>

    <p>A: You can authenticate your requests by including an User auth token in the request headers. Refer
    to the Authentication mechanism in API documentation for specific authentication methods and requirements.</p>

    <h4 id="q-what-data-formats-are-supported-for-request-and-response-payloads">Q: What data formats
    are supported for request and response payloads?</h4>

    <p>A: The APIs support JSON format for request and response payloads. Refer to the API documentation
    for details on supported data formats.</p>

    <h4 id="q-is-there-any-limit-on-the-number-of-requests-i-can-make-to-the-apis">Q: Is there any limit
    on the number of requests I can make to the APIs?</h4>

    <p>A: Yes, there are rate limits enforced on API usage to prevent abuse and maintain system performance.
    If you exceed the rate limits, you may receive a 429 Too Many Requests error. Refer to the API documentation
    for information on rate limits and how to handle them.</p>

    <h4 id="q-how-can-i-handle-pagination-for-listing-apis">Q: How can I handle pagination for listing
    APIs?</h4>

    <p>A: Listing APIs are paginated to manage large datasets efficiently. You can specify query parameters
    such as page number and items per page to navigate through paginated results. Refer to the API documentation
    for pagination parameters and usage instructions.</p>

    <h4 id="q-what-should-i-do-if-i-encounter-errors-while-using-the-apis">Q: What should I do if I encounter
    errors while using the APIs?</h4>

    <p>A: If you encounter errors, first ensure that your request parameters and authentication credentials
    are correct. Check the API documentation for information on error codes and descriptions to troubleshoot
    the issue. If you''re unable to resolve the issue, contact support for assistance.</p>

    <h4 id="q-can-i-receive-real-time-notifications-for-specific-events-using-webhooks">Q: Can I receive
    real-time notifications for specific events using webhooks?</h4>

    <p>A: Yes, you can subscribe to webhooks to receive real-time notifications for events such as alerts
    (e.g., speeding, geofence entry/exit) and live location updates. Refer to the API documentation for
    webhook endpoints for alerts and live location.</p>

    <h4 id="q-how-can-i-ensure-data-security-and-privacy-when-using-the-apis">Q: How can I ensure data
    security and privacy when using the APIs?</h4>

    <p>A: APIs are accessed over HTTPS, ensuring that all data transmitted between your application and
    our servers is encrypted. To maintain system stability and prevent abuse, we implement rate limiting
    on our APIs. We use auth tokens to authenticate requests from clients. This ensures that only authorized
    users or applications can access our API endpoints</p>

    '
- name: Alerts Subscriptions
paths:
  /integration/api/v1/drivers/{driverId}:
    get:
      operationId: getDriver
      summary: Get Driver
      tags:
      - Drivers
      responses:
        '200':
          description: Successful response
      description: '<h3 id="overview">Overview</h3>

        <p>The Driver Details API allows users to retrieve detailed information about a specific driver
        in the LocoNav system. This information includes the driver''s personal details, contact information,
        license details, guarantor information, and uploaded documents.</p>

        <h3 id="path-parameters">Path Parameters</h3>

        <ul>

        <li><code>driverId</code> (integer, required): The unique identifier of the driver for which details
        are requested.</li>

        </ul>

        <h3 id="response-body">Response Body</h3>

        <ul>

        <li><p><code>id</code> (integer): The unique identifier of the driver.</p>

        </li>

        <li><p><code>name</code> (string): The name of the driver.</p>

        </li>

        <li><p><code>phoneNumber</code> (string): The phone number of the driver.</p>

        </li>

        <li><p><code>aadharNumber</code> (string): The Aadhar number of the driver (if available).</p>

        </li>

        <li><p><code>vehicleNumber</code> (string): The vehicle number assigned to the driver.</p>

        </li>

        <li><p><code>licenseNumber</code> (string): The driver''s license number.</p>

        </li>

        <li><p><code>guarantorName</code> (string): The name of the driver''s guarantor.</p>

        </li>

        <li><p><code>guarantorPhoneNumber</code> (string): The phone number of the driver''s guarantor.</p>

        </li>

        <li><p><code>licenseIssueDate</code> (integer): The timestamp of the driver''s license issue date.</p>

        </li>

        <li><p><code>licenseValidFrom</code> (integer): The timestamp of the start date of the driver''s
        license validity.</p>

        </li>

        <li><p><code>licenseValidUpto</code> (integer): The timestamp of the end date of the driver''s
        license validity.</p>

        </li>

        <li><p><code>driverCountryCode</code> (string): The country code of the driver.</p>

        </li>

        <li><p><code>guarantorCountryCode</code> (string): The country code of the driver''s guarantor.</p>

        </li>

        <li><p><code>rfidTrackingId</code> (string): The RFID tracking ID associated with the driver (if
        available).</p>

        </li>

        <li><p><code>uploads</code> (object): An object containing uploaded documents related to the driver.'
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateDrivers
      summary: Update Drivers
      tags:
      - Drivers
      responses:
        '200':
          description: Successful response
      description: '<h2 id="overview">Overview</h2>

        <p>The Update Driver API allows users to update the information of an<br />existing driver profile
        identified by the driver''s unique identifier.</p>

        <h2 id="request-body">Request Body</h2>

        <ul>

        <li><code>name</code> (string): The updated name of the driver.</li>

        <li><code>countryCode</code> (string): The updated country code associated with the driver''s
        phone number.</li>

        <li><code>phoneNumber</code> (string): The updated phone number of the driver.</li>

        </ul>

        <h2 id="response-structure">Response Structure</h2>

        <ul>

        <li><code>success</code> (boolean): Indicates whether the operation was successful.</li>

        <li><code>data</code> (object): Contains details of the updated driver if the operation was successful.<ul>

        <li><code>id</code> (integer): Unique identifier for the updated driver.</li>

        <li><code>name</code> (string): Updated name of the driver.</li>

        </ul>

        </li>

        </ul>

        <h2 id="notes">Notes</h2>

        <ul>

        <li>The <code>{driverId}</code> parameter should be replaced with the actual unique identifier
        of the driver to be updated.</li>

        <li>The <code>countryCode</code> parameter should follow the ISO standard.</li>

        <li>Phone numbers should be provided without any special characters (e.g., spaces, dashes)</li>

        </ul>

        '
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: demo
              countryCode: IN
              phoneNumber: '8259986926'
    delete:
      operationId: deleteDriver
      summary: Delete Driver
      tags:
      - Drivers
      responses:
        '200':
          description: Successful response
      description: '<h2 id="overview">Overview</h2>

        <p>The Delete Driver API enables users to remove a driver profile from the system using the driver''s
        unique identifier.</p>

        <h2 id="request-param">Request Param</h2>

        <p><code>{driverId}</code>: The unique identifier of the driver to be deleted.</p>

        <h2 id="response-structure">Response Structure</h2>

        <ul>

        <li><code>success</code> (boolean): Indicates whether the operation was successful.</li>

        <li><code>data</code> (string): Confirmation message indicating that the driver was deleted successfully.</li>

        </ul>

        <h2 id="notes">Notes</h2>

        <ul>

        <li>The <code>{driverId}</code> parameter should be replaced with the actual unique identifier
        of the driver to be deleted.</li>

        <li>Deleting a driver profile is irreversible. Ensure that the correct driver identifier is provided
        before executing the request.</li>

        </ul>

        '
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: string
  /integration/api/v1/drivers:
    get:
      operationId: listDriversFilter
      summary: List drivers (Filter)
      tags:
      - Drivers
      responses:
        '200':
          description: Successful response
      description: '<h2 id="overview">Overview</h2>

        <p>The Search Drivers API allows users to search for drivers by name. Users can provide a partial
        or full name of the driver to retrieve a list of matching drivers along with their associated
        phone numbers.</p>

        <h2 id="request-parameters">Request Parameters</h2>

        <ul>

        <li><p><code>name</code> (string): The name of the driver to search for. This parameter supports
        partial or full name matching.</p>

        </li>

        <li><p><code>page</code> (integer): The page number of the results to retrieve. Default is 1.</p>

        </li>

        <li><p><code>perPage</code> (integer): The number of results per page. Default is 10.</p>

        </li>

        <li><p><code>getIdAndName</code> (boolean,optional) default true, for more details set it false</p>

        </li>

        <li><p><code>vehicleIds: comma seprated vehicle uuid''s</code></p>

        </li>

        </ul>

        <h2 id="response-structure">Response Structure</h2>

        <ul>

        <li><p><code>values</code> (array): Array containing driver objects matching the search query.</p>

        <ul>

        <li><p><code>id</code> (integer): Unique identifier for the driver.</p>

        </li>

        <li><p><code>name</code> (string): Name of the driver.</p>

        </li>

        <li><p><code>phone_number</code> (string): Phone number of the driver.</p>

        </li>

        </ul>

        </li>

        <li><p><code>pagination</code> (object): Pagination details.</p>

        <ul>

        <li><p><code>page</code> (integer): Current page number.</p>

        </li>

        <li><p><code>perPage</code> (integer): Number of results per page.</p>

        </li>

        <li><p><code>more</code> (boolean): Indicates whether there are more pages of data available.</p>

        </li>

        </ul>

        </li>

        <li><p><code>metadata</code> (object): Additional metadata if available.</p>

        </li>

        </ul>

        <h2 id="note">Note</h2>

        <ul>

        <li>The <code>name</code> parameter supports partial or full name matching, allowing users to
        search for drivers based on various name combinations.</li>

        </ul>

        '
    post:
      operationId: createDrivers
      summary: Create Drivers
      tags:
      - Drivers
      responses:
        '200':
          description: Successful response
      description: '<h2 id="overview">Overview</h2>

        <p>The Create Driver API allows users to create a new driver profile by providing the driver''s
        name, country code, and phone number.</p>

        <h2 id="request-body">Request Body</h2>

        <ul>

        <li><code>name</code> (string): The name of the driver.</li>

        <li><code>countryCode</code> (string): The country code associated with the driver''s phone number.</li>

        <li><code>phoneNumber</code> (string): The phone number of the driver.</li>

        </ul>

        <h2 id="response-structure">Response Structure</h2>

        <ul>

        <li><code>success</code> (boolean): Indicates whether the operation was successful.</li>

        <li><code>data</code> (object): Contains details of the created driver if the operation was successful.<ul>

        <li><code>id</code> (integer): Unique identifier for the created driver.</li>

        <li><code>name</code> (string): Name of the created driver.</li>

        </ul>

        </li>

        </ul>

        <h2 id="notes">Notes</h2>

        <ul>

        <li>The <code>countryCode</code> parameter should follow the ISO standard.</li>

        <li>Phone numbers should be provided without any special characters (e.g., spaces, dashes)</li>

        </ul>

        '
  /integration/api/v1/driver_vehicle_assignments:
    post:
      operationId: vehicleAssignment
      summary: Vehicle Assignment
      tags:
      - Drivers
      responses:
        '200':
          description: Successful response
      description: '<h3 id="overview">Overview</h3>

        <p>The Driver Vehicle Assignments API allows users to assign a driver to a specific vehicle in
        the LocoNav system. This association enables tracking and management of vehicles based on the
        assigned driver.</p>

        <h3 id="request-body">Request Body</h3>

        <ul>

        <li><p><code>vehicleId</code> (string, required): The unique identifier of the vehicle to be assigned
        to the driver.</p>

        </li>

        <li><p><code>driverId</code> (integer, required): The unique identifier of the driver to be assigned
        to the vehicle.</p>

        </li>

        </ul>

        <h3 id="response">Response</h3>

        <h4 id="successful-response-200-ok">Successful Response (200 OK)</h4>

        <h3 id="status-codes">Status Codes</h3>

        <ul>

        <li><p><code>200 OK</code>: The driver was successfully assigned to the vehicle.</p>

        </li>

        <li><p><code>404 Not Found</code>: The specified vehicle was not found in the system.</p>

        </li>

        </ul>

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              vehicleId: 077c6ab2-6456-4e07-abd6-1e18bbe7ba1d
              driverId: 29866
  /integration/api/v1/driver_vehicle_unassignments:
    put:
      operationId: vehicleUnassignment
      summary: Vehicle Unassignment
      tags:
      - Drivers
      responses:
        '200':
          description: Successful response
      description: '<h3 id="overview">Overview</h3>

        <p>The Driver Vehicle Unassignments API allows users to remove the association of a driver from
        a specific vehicle in the LocoNav system. This action disassociates the driver from the vehicle
        for tracking and management purposes.</p>

        <h3 id="request-body">Request Body</h3>

        <ul>

        <li><p><code>vehicleId</code> (string, required): The unique identifier of the vehicle from which
        the driver will be unassigned.</p>

        </li>

        <li><p><code>driverId</code> (integer, required): The unique identifier of the driver to be unassigned
        from the vehicle.</p>

        </li>

        </ul>

        <h3 id="response">Response</h3>

        <h4 id="successful-response-200-ok">Successful Response (200 OK)</h4>

        <h3 id="status-codes">Status Codes</h3>

        <ul>

        <li><p><code>200 OK</code>: The driver was successfully unassigned from the vehicle.</p>

        </li>

        <li><p><code>422 Unprocessable Entity</code>: The specified driver is not currently assigned to
        the provided vehicle.</p>

        </li>

        </ul>

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              vehicleId: 077c6ab2-6456-4e07-abd6-1e18bbe7ba1d
              driverId: 29866
  /integration/api/v1/livestreams/{sessionId}:
    get:
      operationId: getLivesteam
      summary: Get Livesteam
      tags:
      - Video Telematics VT / Live Stream
      responses:
        '200':
          description: Successful response
      description: '<h2 id="overview">Overview</h2>

        <p>This API retrieves the live video stream for vehicle telematics. It requires the session ID
        of the livestream.</p>

        <h2 id="query-parameters">Query Parameters</h2>

        <ul>

        <li><code>sessionId</code> (string): The session ID of the livestream.</li>

        </ul>

        <h2 id="request-headers">Request Headers</h2>

        <ul>

        <li><code>User-Authentication</code>: Your user authentication token.</li>

        <li><code>Content-Type</code>: application/json</li>

        </ul>

        <h2 id="response">Response</h2>

        <p>The API returns a JSON object with the following fields:</p>

        <ul>

        <li><code>streamId</code> (string): The ID of the video stream.</li>

        <li><code>backCamUrl</code> (string): URL for the back camera feed.</li>

        <li><code>frontCamUrl</code> (string): URL for the front camera feed.</li>

        <li><code>options</code> (array of strings): Available video options.</li>

        <li><code>currentResolution</code> (string): Current video resolution.</li>

        <li><code>sessionId</code> (string): The session ID of the livestream.</li>

        <li><code>status</code> (string): Status of the livestream (e.g., "active").</li>

        <li><code>keepAliveInterval</code> (integer): Interval for keeping the livestream alive.</li>

        <li><code>totalSessionTime</code> (integer): Total duration of the livestream session. (time in
        seconds)</li>

        <li><code>activeSessions</code> (integer): Number of active livestream sessions.</li>

        <li><code>expiryNotificationBuffer</code> (integer): Buffer time for expiry notification.</li>

        <li><code>afterExpiryBuffer</code> (integer): Buffer time after expiry.</li>

        </ul>

        <h2 id="notes">Notes</h2>

        <ul>

        <li>The livestream URLs (<code>backCamUrl</code> and <code>frontCamUrl</code>) should be used
        to access the video feeds.</li>

        <li>Ensure that the session ID provided is valid and active.</li>

        <li>Authentication token is required for accessing the livestream.</li>

        <li>The response may contain additional fields not listed here.</li>

        </ul>

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateLivestream
      summary: Update Livestream
      tags:
      - Video Telematics VT / Live Stream
      responses:
        '200':
          description: Successful response
      description: '<h2 id="overview">Overview</h2>

        <p>This API endpoint facilitates the modification of a livestream session, allowing users to either
        update its resolution or extend its duration.</p>

        <h2 id="request-body">Request Body</h2>

        <ul>

        <li><p><strong><code>operation</code></strong> (string): Indicates operation whether to update
        resolution or extend the livestream session.</p>

        <ul>

        <li><p>Data Type: String</p>

        </li>

        <li><p>Options: "<strong>change_resolution</strong>" or "<strong>extend_duration</strong>"</p>

        </li>

        </ul>

        </li>

        <li><p><strong><code>resolution</code></strong> (string): Specifies the desired resolution for
        the livestream.</p>

        <ul>

        <li>Data Type: String</li>

        <li>Options: "640x480", "1280x720", "1920x1080", "3840x2160"</li>

        </ul>

        </li>

        </ul>

        <h2 id="response-body">Response Body</h2>

        <ul>

        <li><strong><code>success</code></strong> (boolean): Indicates whether the request was successful.<ul>

        <li>Data Type: Boolean</li>

        </ul>

        </li>

        <li><strong><code>message</code></strong> (string): Message confirming the success of the livestream
        session update.<ul>

        <li>Data Type: String</li>

        </ul>

        </li>

        </ul>

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              operation: extend_duration
              resolution: 640x480
  /integration/api/v1/livestreams:
    post:
      operationId: createLivestream
      summary: Create Livestream
      tags:
      - Video Telematics VT / Live Stream
      responses:
        '200':
          description: Successful response
      description: '<h2 id="overview"><strong>Overview</strong></h2>

        <p>This API initiates a live video streaming session for a vehicle. Data will be returned if vehicle
        support Video or contains active VT device.</p>

        <h2 id="request-body"><strong>Request Body</strong></h2>

        <ul>

        <li><p><code>vehicleId</code> (string): The ID of the vehicle</p>

        </li>

        <li><p><code>resolution</code> (string): The desired resolution for the video stream. Options</p>

        <ul>

        <li>640x480</li>

        <li>1280x720</li>

        </ul>

        </li>

        </ul>

        <h2 id="response-structure"><strong>Response Structure</strong></h2>

        <ul>

        <li><p><code>success</code> (boolean): Indicates whether the request was successful or not.</p>

        </li>

        <li><p><code>data</code> (object): Contains the details of the live video streaming session.</p>

        <ul>

        <li><code>streamId</code> (string): The ID of the video streaming session.</li>

        <li><code>backCamUrl</code> (string): URL for accessing the live stream from the back camera.</li>

        <li><code>frontCamUrl</code> (string): URL for accessing the live stream from the front camera.</li>

        <li><code>options</code> (array of strings): Available options for the video stream.</li>

        <li><code>currentResolution</code> (string): The current resolution of the video stream.</li>

        <li><code>sessionId</code> (string): The ID of the session.</li>

        <li><code>status</code> (string): The status of the session (e.g., initiated, active).</li>

        <li><code>keepAliveInterval</code> (integer): The interval (in seconds) for sending keep-alive
        signals.</li>

        <li><code>totalSessionTime</code> (integer): The total duration of the session (in seconds).</li>

        <li><code>activeSessions</code> (integer): The number of active sessions.</li>

        <li><code>expiryNotificationBuffer</code> (integer): The buffer time (in seconds) for expiry notification.</li>

        <li><code>afterExpiryBuffer</code> (integer): The buffer time (in seconds) after expiry.</li>

        </ul>

        </li>

        </ul>

        <h2 id="notes"><strong>Notes</strong></h2>

        <ul>

        <li>The <code>resolution</code> parameter specifies the'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              vehicleId: ff3fb6bf-1c1e-429d-b5ac-60afda6ee94f
              resolution: 640x480
  /integration/api/v1/livestreams/{streamId}:
    delete:
