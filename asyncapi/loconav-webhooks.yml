generated: '2026-07-20'
method: searched
source: https://developers.loconav.com/ (Webhooks folder of published Postman collection)
description: 'LocoNav pushes real-time events to a partner-registered receiver URL. Two families: Alert
  webhooks (safety/telemetry events) and Live Location webhooks (periodic GPS position push). Each alert
  payload carries a "kind" discriminator, event_time, latitude/longitude, truck_id and vehicle_number.'
transport: HTTP POST (partner-hosted receiver URL)
discriminator: kind
families:
- name: alert
  description: Safety and telemetry alert notifications.
- name: live-location
  description: Periodic live GPS location push for vehicles/assets.
