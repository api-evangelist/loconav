- aid: loconav:loconav-polygon-geofence-api
  name: LocoNav Polygon (Geofence) API
  description: >-
    <p>A geofence is a virtual boundary, often a <strong>rectangular bounding box</strong>, created using
    mapping software with specified latitude and longitude coordinates. Integrated with fleet management
    and telematics, geofences trigger real-time alerts if a GPS-equipped vehicle or equipment moves beyond
    authorized limits, enhancing security and asset monitoring.</p>

    <hr />

    <p><strong>Use Cases</strong></p>

    <ol>

    <li><strong>Security and Alerts:</strong> Geofences can be established around construction sites where
    valuable equipment is stationed. If any equipment equipped with a GPS tracker is detected leaving
    the predefined area, immediate alerts are triggered, helping prevent theft and aiding in the recovery
    of the asset.</li>

    <li><strong>Delivery Route Compliance:</strong> For logistics and delivery services, geofences can
    be set along specified routes or delivery zones. If a delivery vehicle deviates from the planned route
    or enters unauthorized areas, real-time alerts ensure adherence to planned schedules and prevent potential
    route deviations or unauthorized stops.</li>

    </ol>
  humanURL: https://developers.loconav.com/
  baseURL: https://api.a.loconav.com/integration/api/v1
  tags:
  - Polygon (Geofence)
