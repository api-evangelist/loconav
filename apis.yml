aid: loconav
name: LocoNav
description: >-
  LocoNav is an AI- and IoT-powered GPS vehicle tracking and smart fleet
  management platform used across 50+ countries, integrating 2,200+ device and
  sensor types to track vehicles and assets in real time. Its LocoNav
  Integration API exposes REST endpoints and webhooks for fleet telematics:
  telematics data (sensor readings, GPS location, distance, timelines, video and
  live streams), CRUD management of drivers, vehicles, trips, geofence polygons
  and users, driver-vehicle assignment, vehicle scorecards, immobilization, live
  share links, and alert subscriptions. Real-time alert and live-location
  webhooks push events such as overspeed, harsh braking/acceleration, geofence,
  fatigue, crash, fuel-theft, anti-theft and device-offline. Authentication is a
  user-level token in the User-Authentication header; all listing endpoints are
  paginated and time parameters use epoch seconds.
